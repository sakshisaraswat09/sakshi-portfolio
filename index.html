    <style type="text/tailwindcss">
    @layer theme {
        :root {
            --bg-primary: #050505;
            --bg-secondary: #0a0a0a;
            --accent-primary: #3b82f6;
            --accent-secondary: #8b5cf6;
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --border-color: rgba(255, 255, 255, 0.1);
        }
    }

    @layer base {
        * {
            scroll-behavior: smooth;
        }
        
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
            line-height: 1.6;
        }
        
        h1, h2, h3, h4, h5, h6 {
            font-weight: 600;
            letter-spacing: -0.02em;
        }
    }

    @layer utilities {
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .hover-glow:hover {
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.3);
        }

        .btn-lift {
            transition: transform 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease;
        }
        .btn-lift:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 28px rgba(59, 130, 246, 0.35), 0 0 32px rgba(139, 92, 246, 0.2);
        }

        .icon-hover-bounce {
            display: inline-block;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        a:hover .icon-hover-bounce,
        button:hover .icon-hover-bounce {
            animation: icon-bounce 0.55s ease;
        }

        .icon-hover-spin {
            display: inline-block;
            transition: transform 0.35s ease;
        }
        a:hover .icon-hover-spin,
        button:hover .icon-hover-spin {
            transform: rotate(12deg) scale(1.15);
        }

        .skill-pill {
            transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        }
        .skill-pill:hover {
            transform: scale(1.08);
            box-shadow: 0 0 16px rgba(59, 130, 246, 0.2);
        }

        .skill-icon-wrap {
            transition: transform 0.25s ease, background-color 0.25s ease;
        }
        .skill-icon-wrap:hover {
            transform: scale(1.12);
            background-color: rgba(59, 130, 246, 0.18);
        }
        .skill-icon-wrap:hover .skill-category-icon {
            transform: scale(1.15);
        }
        .skill-category-icon {
            display: inline-block;
            transition: transform 0.25s ease;
        }
        .glass.rounded-2xl:hover .skill-category-icon {
            transform: scale(1.1);
        }

        @keyframes icon-bounce {
            0%, 100% { transform: translateY(0) rotate(0); }
            30% { transform: translateY(-8px) rotate(-6deg); }
            50% { transform: translateY(-4px) rotate(6deg); }
            70% { transform: translateY(-6px) rotate(-3deg); }
        }

        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-surface {
            background-color: var(--bg-primary);
        }
    }
    </style>
